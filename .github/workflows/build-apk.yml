name: Build FantasyTowerDefense APK



on:

 workflow_dispatch:



permissions:

 contents: read



jobs:

 build:

   runs-on: ubuntu-latest



   steps:

     - name: Checkout repository

       uses: actions/checkout@v4



     - name: Setup Java 17

       uses: actions/setup-java@v4

       with:

         distribution: temurin

         java-version: '17'



     - name: Setup Android SDK

       uses: android-actions/setup-android@v3



     - name: Install Android SDK packages

       shell: bash

       run: |

         set -e

         sdkmanager --install \

           "platform-tools" \

           "platforms;android-33" \

           "platforms;android-35" \

           "build-tools;33.0.2" \

           "build-tools;35.0.1"



     - name: Setup Godot

       uses: chickensoft-games/setup-godot@v2

       with:

         version: 4.4.1

         use-dotnet: false



     - name: Install Godot Android export templates

       shell: bash

       run: |

         set -e



         TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"

         mkdir -p "$TEMPLATE_DIR"

         mkdir -p "$RUNNER_TEMP/godot_templates"



         curl -fL \

           "https://downloads.tuxfamily.org/godotengine/4.4.1/Godot_v4.4.1-stable_export_templates.tpz" \

           -o "$RUNNER_TEMP/templates.tpz"



         unzip -q "$RUNNER_TEMP/templates.tpz" \

           -d "$RUNNER_TEMP/godot_templates"



         cp -a "$RUNNER_TEMP/godot_templates/templates/." "$TEMPLATE_DIR/"



         test -f "$TEMPLATE_DIR/android_debug.apk"

         test -f "$TEMPLATE_DIR/android_release.apk"



     - name: Locate and extract game project

       shell: bash

       run: |

         set -e



         ZIP="$GITHUB_WORKSPACE/FantasyTowerDefense_Godot_Upgrade.zip"



         if [ ! -f "$ZIP" ]; then

           echo "ERROR: Game ZIP not found."

           find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name '*.zip'

           exit 1

         fi



         mkdir -p "$GITHUB_WORKSPACE/GameProject"

         unzip -oq "$ZIP" -d "$GITHUB_WORKSPACE/GameProject"



         PROJECT_FILE=$(find "$GITHUB_WORKSPACE/GameProject" \

           -type f -name project.godot -print -quit)



         if [ -z "$PROJECT_FILE" ]; then

           echo "ERROR: project.godot was not found in the ZIP."

           find "$GITHUB_WORKSPACE/GameProject" \

             -maxdepth 4 -type f | head -100

           exit 1

         fi



         PROJECT_DIR="$(dirname "$PROJECT_FILE")"

         echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"



         echo "Godot project: $PROJECT_DIR"



     - name: Configure Android debug signing

       shell: bash

       run: |

         set -e



         KEYSTORE="$RUNNER_TEMP/debug.keystore"



         keytool -genkeypair \

           -keystore "$KEYSTORE" \

           -storepass android \

           -alias androiddebugkey \

           -keypass android \

           -keyalg RSA \

           -keysize 2048 \

           -validity 10000 \

           -dname "CN=Android Debug,O=Android,C=US"



         mkdir -p "$HOME/.config/godot"



         cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF

         [resource]

         config_version = 5

         export/android/android_sdk_path = "$ANDROID_HOME"

         export/android/java_sdk_path = "$JAVA_HOME"

         export/android/debug_keystore = "$KEYSTORE"

         export/android/debug_keystore_user = "androiddebugkey"

         export/android/debug_keystore_pass = "android"

         EOF



         echo "Android SDK: $ANDROID_HOME"

         echo "Java SDK: $JAVA_HOME"



     - name: Import Godot project

       shell: bash

       run: |

         set -e



         godot --headless \

           --editor \

           --path "$PROJECT_DIR" \

           --quit



     - name: Verify Android export preset

       shell: bash

       run: |

         set -e



         PRESET="$PROJECT_DIR/export_presets.cfg"



         if [ ! -f "$PRESET" ]; then

           echo "ERROR: export_presets.cfg was not found."

           echo "The project needs an Android export preset."

           exit 1

         fi



         if ! grep -q 'name="Android"' "$PRESET"; then

           echo "ERROR: No Android export preset was found."

           cat "$PRESET"

           exit 1

         fi



         echo "Android export preset found."



     - name: Export Android APK

       shell: bash

       run: |

         set -e



         mkdir -p "$GITHUB_WORKSPACE/output"



         godot --headless \

           --path "$PROJECT_DIR" \

           --export-debug "Android" \

           "$GITHUB_WORKSPACE/output/FantasyTowerDefense.apk"



         test -s "$GITHUB_WORKSPACE/output/FantasyTowerDefense.apk"



         echo "APK export completed."

         ls -lh "$GITHUB_WORKSPACE/output/FantasyTowerDefense.apk"



     - name: Upload APK artifact

       if: success()

       uses: actions/upload-artifact@v4

       with:

         name: FantasyTowerDefense-Android-APK

         path: output/FantasyTowerDefense.apk

         if-no-files-found: error

         retention-days: 7



     - name: Upload diagnostic logs

       if: failure()

       uses: actions/upload-artifact@v4

       with:

         name: FantasyTowerDefense-Build-Logs

         path: |

           GameProject/**/*.log

           GameProject/export_presets.cfg

         if-no-files-found: ignore

         retention-days: 7
