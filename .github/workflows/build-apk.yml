name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build FantasyTowerDefense APK
    runs-on: ubuntu-latest
    steps:
      # 1. 下载仓库文件
      - name: Checkout repository
        uses: actions/checkout@v4
      # 2. 安装 Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 3. 安装 Android SDK
      # 显式指定需要的 SDK 包，避免寻找已经废弃的 tools 包
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 platforms;android-35 build-tools;33.0.2 build-tools;35.0.1'
      # 安装普通版 Godot，不使用 Mono/.NET 版本
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      # 5. 安装 Godot 安卓导出模板
      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.4.1.stable"
          TEMPLATE_URL="https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"
          DOWNLOAD_DIR="/tmp/godot-templates"
          mkdir -p "$TEMPLATE_DIR" "$DOWNLOAD_DIR"
          echo "Downloading Godot export templates..."
          curl -fL --retry 5 --retry-delay 2 \
            "$TEMPLATE_URL" \
            -o "$DOWNLOAD_DIR/templates.tpz"
          echo "Extracting Godot export templates..."
          unzip -oq "$DOWNLOAD_DIR/templates.tpz" \
            -d "$DOWNLOAD_DIR/extracted"
          if [ ! -d "$DOWNLOAD_DIR/extracted/templates" ]; then
            echo "ERROR: Export templates archive has an unexpected structure."
            find "$DOWNLOAD_DIR/extracted" -maxdepth 2 -type f | head -50
            exit 1
          fi
          cp -a "$DOWNLOAD_DIR/extracted/templates/." "$TEMPLATE_DIR/"
          echo "Checking Android export templates..."
          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ] || \
             [ ! -f "$TEMPLATE_DIR/android_release.apk" ]; then
            echo "ERROR: Android export templates are missing."
            ls -lah "$TEMPLATE_DIR"
            exit 1
          fi
          echo "Godot Android export templates installed successfully." 
      # 6. 解压游戏工程
      - name: Extract game project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="FantasyTowerDefense_Godot_Upgrade.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Game project ZIP not found: $ZIP_FILE"
            echo "Files in repository:"
            ls -la
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/GameProject"
          unzip -oq "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/GameProject"
          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/GameProject" \
            -type f -name project.godot -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found in the ZIP."
            find "$GITHUB_WORKSPACE/GameProject" \
              -maxdepth 3 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Game project found at: $PROJECT_DIR"
      # 7. 配置 Android 调试签名
      - name: Configure Android signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      # 8. 导入 Godot 项目并检查导出配置
      # 配置 Godot 的 Android SDK、Java 和调试签名
      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          JAVA_PATH="${JAVA_HOME:?JAVA_HOME is not set}"
          KEYSTORE_PATH="$HOME/.android/debug.keystore"
          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR"
          if [ ! -d "$SDK_PATH/platform-tools" ]; then
            echo "ERROR: Android SDK platform-tools not found: $SDK_PATH"
            exit 1
          fi
          if [ ! -x "$JAVA_PATH/bin/java" ]; then
            echo "ERROR: Java executable not found: $JAVA_PATH/bin/java"
            exit 1
          fi
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "ERROR: Debug keystore not found: $KEYSTORE_PATH"
            exit 1
          fi
          cat > "$SETTINGS_DIR/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/debug_keystore = "$KEYSTORE_PATH"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Android SDK: $SDK_PATH"
          echo "Java SDK: $JAVA_PATH"
          echo "Godot Android settings configured."
      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          echo "Project directory: $PROJECT_DIR"
          python3 - <<'PY'
          import re
          import os
          path = os.path.join(
              os.environ["PROJECT_DIR"],
              "export_presets.cfg"
          )
          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()
          result = []
          in_android_options = False
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("["):
                  in_android_options = (
                      stripped == "[preset.0.options]"
                  )
              if in_android_options and re.match(
                  r'^(version/(min_sdk|target_sdk)|'
                  r'gradle_build/(min_sdk|target_sdk))\s*=',
                  stripped
              ):
                  print("Removing incompatible SDK override:", stripped)
                  continue
              result.append(line)
          with open(path, "w", encoding="utf-8") as f:
              f.writelines(result)
          print("Android SDK export settings adjusted.")
          PY
          godot --version
          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg is missing."
            echo "The project must have an Android export preset named Android."
            exit 1
          fi
          if ! grep -q 'name="Android"' \
            "$PROJECT_DIR/export_presets.cfg"; then
            echo "ERROR: Android export preset was not found."
            cat "$PROJECT_DIR/export_presets.cfg"
            exit 1
          fi
          godot --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --import
      # 9. 导出 APK
      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/output/FantasyTowerDefense.apk"
          if [ ! -s "$GITHUB_WORKSPACE/output/FantasyTowerDefense.apk" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "APK generated successfully."
          ls -lh "$GITHUB_WORKSPACE/output/FantasyTowerDefense.apk"
      # 10. 上传 APK，供手机下载安装
      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FantasyTowerDefense-Android-APK
          path: output/FantasyTowerDefense.apk
          if-no-files-found: error
          retention-days: 7
      # 11. 失败时保留诊断信息
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FantasyTowerDefense-Build-Logs
          path: |
            GameProject/export_presets.cfg
            GameProject/project.godot
          if-no-files-found: ignore
          retention-days: 7
