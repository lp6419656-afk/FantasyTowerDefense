name: Build FantasyTowerDefense APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-35" \
            "build-tools;33.0.2" \
            "build-tools;35.0.1"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$RUNNER_TEMP/godot_templates"

          curl -fL \
            "https://downloads.tuxfamily.org/godotengine/4.4.1/Godot_v4.4.1-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"

          unzip -q "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/godot_templates"

          cp -a "$RUNNER_TEMP/godot_templates/templates/." \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

          ls -la "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Locate and extract game project
        shell: bash
        run: |
          set -e

          ZIP="./FantasyTowerDefense_Godot_Upgrade.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Game ZIP not found: $ZIP"
            find . -maxdepth 4 -type f -name '*.zip'
            exit 1
          fi

          mkdir -p GameProject
          unzip -oq "$ZIP" -d GameProject

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/GameProject" \
            -type f -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found in the ZIP."
            find GameProject -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found Godot project at: $PROJECT_DIR"

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [resource]
          config_version = 5
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import Godot project
        run: |
          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Export Android APK
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/output"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/output/FantasyTowerDefense.apk"

          test -s "$GITHUB_WORKSPACE/output/FantasyTowerDefense.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FantasyTowerDefense-Android-APK
          path: output/FantasyTowerDefense.apk
          if-no-files-found: error
          retention-days: 7
